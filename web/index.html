<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>track-overlay</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <strong id="track-name">…</strong>
    <span class="muted" id="session-info"></span>
    <span class="spacer"></span>
    <span class="muted" id="sync-info"></span>
    <button id="open-picker" class="bar-btn" title="The files this project is built from">📂 Files</button>
    <button id="home" class="bar-btn" title="Back to the project list">☰ Projects</button>
  </header>

  <div id="picker" class="picker" hidden>
    <div class="picker-box">
      <div class="picker-head">
        <strong id="picker-title">Session files</strong>
        <code class="muted" id="picker-build-id"></code>
        <span class="spacer"></span>
        <button id="picker-close">✕</button>
      </div>
      <div class="picker-list" id="picker-list"></div>
      <div class="picker-foot">
        <button id="picker-add">Add files…</button>
        <span class="muted" id="picker-drop" hidden></span>
        <input id="picker-track" type="text" placeholder="Circuit name" autocomplete="off">
        <span class="muted" id="picker-chosen">nothing yet</span>
        <span class="spacer"></span>
        <button id="picker-build" disabled>Build session</button>
      </div>
      <div id="picker-progress" hidden>
        <div class="export-row">
          <span class="muted" id="picker-stage"></span>
          <span class="spacer"></span>
          <code id="picker-percent">0%</code>
        </div>
        <div class="export-track"><div id="picker-fill"></div></div>
      </div>
      <div class="muted" id="picker-status"></div>
    </div>
  </div>

  <main id="stage">
    <div id="slots"></div>
    <canvas id="overlay"></canvas>
    <div id="empty" class="empty">No video attached — showing telemetry only</div>
    <div id="no-session" class="empty" hidden>
      Nothing built yet — add the RaceBox export and the GoPro files, then build.
    </div>
  </main>

  <section class="readout" id="readout"></section>

  <section id="sync-panel" class="sync" hidden>
    <div class="sync-row">
      <strong>Check the sync</strong>
      <select id="sync-clip" title="Which camera to adjust"></select>
      <span class="muted" id="sync-method"></span>
      <span class="spacer"></span>
      <button id="sync-brake" title="Jump to a hard braking point — the easiest frame to judge">Next braking ⤓</button>
      <input id="sync-slider" type="range" min="-5" max="5" step="0.02" value="0"
             title="Shift this camera against the telemetry, in seconds">
      <code id="sync-value">+0.00 s</code>
      <span class="muted" id="sync-saved"></span>
      <button id="sync-later">Later</button>
      <button id="sync-confirm">Looks right</button>
    </div>
  </section>

  <div id="export-panel" class="export-panel" hidden>
    <div class="export-row">
      <strong id="export-stage">…</strong>
      <span class="spacer"></span>
      <code id="export-percent">0%</code>
      <button id="export-cancel">Cancel</button>
    </div>
    <div class="export-track"><div id="export-fill"></div></div>
    <div class="export-row" id="export-done" hidden>
      <span class="muted" id="export-result"></span>
      <span class="spacer"></span>
      <a id="export-download" class="linkbtn" download>⬇ Download</a>
      <button id="export-reveal">Show in Finder</button>
    </div>
    <div class="muted" id="export-error"></div>
  </div>

  <footer class="transport">
    <div class="transport-row">
    <button id="play" title="Space">▶</button>
    <button id="prev-lap" title="Arrow up">⏮</button>
    <button id="next-lap" title="Arrow down">⏭</button>
    <button id="rate">1×</button>
    <button id="sound" title="Sound from the camera in the main slot (M)">🔇</button>
    <button id="swap" title="Swap main view and inset from here (S)">⇄</button>
    <button id="segment" title="Swap for a stretch: click to mark the start, again to end it (D)">⇄ …</button>
    <button id="cut" title="Cut a stretch out: click to mark the start, again to end it (X)">✂ …</button>
    <button id="laps-only" title="Trim to the timed laps, dropping the ride out and back">laps</button>
    <div class="menu">
      <button id="widgets-button" title="Which widgets are on screen">⊞ widgets</button>
      <div class="menu-panel" id="widgets-menu" hidden></div>
    </div>
    <button id="undo" title="Undo the last change (⌘Z)" disabled>↶</button>
    <button id="redo" title="Redo (⇧⌘Z)" disabled>↷</button>
    <button id="reset" title="Return everything to the default layout">↺</button>
    <button id="export" title="Compose everything into one video">⬇ Export</button>
    <select id="resolution" title="Output resolution">
      <option value="1280x720">720p</option>
      <option value="1920x1080" selected>1080p</option>
      <option value="2560x1440">1440p</option>
      <option value="3840x2160">2160p</option>
    </select>
    <button id="open-sync" title="Check the telemetry against the picture again">⇆ sync</button>
    <select id="export-range" title="How much to render">
      <option value="10">10 s</option>
      <option value="60">1 min</option>
      <option value="300">5 min</option>
      <option value="0">whole session</option>
    </select>
    </div>

    <div class="transport-row">
    <div class="timeline" id="timeline">
      <canvas class="strip" id="strip"></canvas>
      <div class="laps" id="lap-marks"></div>
      <div class="gaps" id="gap-marks"></div>
      <div class="cuts" id="cut-marks"></div>
      <div class="pending" id="pending-range" hidden></div>
      <div class="playhead" id="playhead"></div>
    </div>
    <code id="clock-time">0:00.000</code>
    <code id="lap-label" class="muted">—</code>
    </div>
  </footer>

  <script src="js/sr-track.js"></script>
  <script src="js/session.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/cuts.js"></script>
  <script src="js/history.js"></script>
  <script src="js/filmstrip.js"></script>
  <script src="js/laptimes.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ranges.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/display.js"></script>
  <script src="js/webm-muxer.min.js"></script>
  <script src="js/mp4-muxer.min.js"></script>
  <script src="js/export_overlay.js"></script>
  <script src="js/export_ui.js"></script>
  <script src="js/widgets/index.js"></script>
  <script src="js/widgets/speed.js"></script>
  <script src="js/widgets/lean.js"></script>
  <script src="js/widgets/accel.js"></script>
  <script src="js/widgets/map.js"></script>
  <script src="js/widgets/laptime.js"></script>
  <script src="js/widgets/laplist.js"></script>
  <script src="js/state.js"></script>
</body>
</html>
